name: Update lessons and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 23:37 Taipei: prepare today's + tomorrow's sets before midnight.
    # GitHub scheduled runs can be delayed; the browser has a dated fallback.
    - cron: '37 15 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch daily news and vocabulary
        run: pnpm update-content
      - name: Test attendance and daily rotation
        run: pnpm test
      - name: Commit content snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/daily.json
          if ! git diff --staged --quiet; then
            git commit -m "Update daily English content"
            git push
          fi
      - name: Build static website
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
